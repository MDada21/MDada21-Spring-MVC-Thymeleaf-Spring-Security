<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>Add / Edit Product</h2>

    <form th:action="@{/save}" th:object="${product}" method="post" class="mt-3">

        <input type="hidden" th:field="*{id}"/>

        <!-- NAME -->
        <div class="mb-3">
            <label>Name</label>
            <input type="text" th:field="*{name}" class="form-control">

            <div class="text-danger" th:errors="*{name}"></div>
        </div>

        <!-- PRICE -->
        <div class="mb-3">
            <label>Price</label>
            <input type="number" step="0.1" th:field="*{price}" class="form-control">

            <div class="text-danger" th:errors="*{price}"></div>
        </div>

        <!-- QUANTITY -->
        <div class="mb-3">
            <label>Quantity</label>
            <input type="number" th:field="*{quantity}" class="form-control">

            <div class="text-danger" th:errors="*{quantity}"></div>
        </div>

        <!-- BUTTON -->
        <button type="submit" class="btn btn-success">
            Save
        </button>

        <a href="/index" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
